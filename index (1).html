<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recetario de cocina mexicana</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{--fondo:#fbfbf9;--tinta:#1c1c1e;--suave:#5f5f63;--regla:#d8d8d2;--vino:#6b1d2a;--papel:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:400 1.0625rem/1.65 "Libre Caslon Text",Georgia,"Times New Roman",serif}
h1,h2,h3{font-weight:700;line-height:1.2;margin:0}
button,select,.ui{font-family:"Public Sans",system-ui,sans-serif}
a,button{color:inherit}
:focus-visible{outline:2px solid var(--vino);outline-offset:3px}
.pagina{max-width:1040px;margin:0 auto;padding:2.5rem 1.5rem 4rem}
.pie{max-width:1040px;margin:0 auto;padding:1.25rem 1.5rem 2.5rem;border-top:1px solid var(--regla);color:var(--suave);font-size:.9rem}

/* Índice */
.titulo-obra{padding-bottom:1.5rem;border-bottom:2px solid var(--tinta);margin-bottom:.5rem}
.titulo-obra h1{font-size:clamp(2.2rem,6vw,3.4rem);letter-spacing:-.01em}
.titulo-obra p{margin:.6rem 0 0;color:var(--suave);font-style:italic;max-width:56ch}
.indice{list-style:none;margin:0;padding:0}
.indice li{border-bottom:1px solid var(--regla)}
.entrada{display:grid;grid-template-columns:1fr;gap:1.25rem;width:100%;text-align:left;background:none;border:0;padding:1.75rem 0;cursor:pointer;font-family:inherit}
.entrada img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.entrada h2{font-size:1.7rem;margin-bottom:.4rem}
.entrada:hover h2{color:var(--vino);text-decoration:underline;text-underline-offset:5px}
.entrada p{margin:0 0 .6rem;max-width:58ch}
.datos{font-family:"Public Sans",system-ui,sans-serif;font-size:.88rem;color:var(--suave)}
@media(min-width:720px){.entrada{grid-template-columns:260px 1fr;align-items:start;gap:2rem}}

/* Receta */
.volver{background:none;border:0;padding:.25rem 0;font-size:.92rem;color:var(--suave);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.volver:hover{color:var(--vino)}
.cabecera{display:grid;gap:1.75rem;margin:1.5rem 0 2.5rem;padding-bottom:2rem;border-bottom:2px solid var(--tinta)}
.cabecera h1{font-size:clamp(2rem,5.5vw,3rem);margin-bottom:.9rem}
.cabecera .resumen{margin:0 0 1.5rem;max-width:52ch}
.cabecera figure{margin:0}
.cabecera img{width:100%;height:auto;display:block}
.cabecera figcaption{font-size:.85rem;color:var(--suave);margin-top:.5rem;font-style:italic}
@media(min-width:800px){.cabecera{grid-template-columns:1.15fr 1fr;align-items:start;gap:2.5rem}}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.5rem 1.5rem;font-family:"Public Sans",system-ui,sans-serif;font-size:.95rem}
dt{color:var(--suave)}
dd{margin:0;font-weight:600}
select{font-size:.95rem;font-weight:600;padding:.3rem .5rem;border:1px solid var(--tinta);background:var(--papel);border-radius:2px}
.cuerpo{display:grid;gap:2.5rem}
@media(min-width:800px){.cuerpo{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:3rem}}
h2.seccion{font-size:1.35rem;padding-bottom:.5rem;border-bottom:1px solid var(--tinta);margin-bottom:.25rem}
.ayuda{font-family:"Public Sans",system-ui,sans-serif;font-size:.82rem;color:var(--suave);margin:.5rem 0 .75rem}
table{width:100%;border-collapse:collapse}
td{padding:.55rem 0;border-bottom:1px solid var(--regla);vertical-align:top}
td.cant{width:7.5rem;font-variant-numeric:tabular-nums;font-weight:700;padding-right:.75rem}
td label{display:flex;gap:.6rem;cursor:pointer}
input[type=checkbox]{margin-top:.4rem;accent-color:var(--vino);flex-shrink:0}
tr.ok td{color:var(--suave);text-decoration:line-through}
ol{list-style:none;margin:0;padding:0;counter-reset:p}
ol li{counter-increment:p;display:grid;grid-template-columns:2.25rem 1fr;gap:.25rem;padding:1rem 0;border-bottom:1px solid var(--regla)}
ol li::before{content:counter(p) ".";font-weight:700;color:var(--vino)}
ol h3{font-size:1.05rem;margin-bottom:.25rem}
ol p{margin:0;max-width:62ch}
ol .t{display:block;margin-top:.35rem;font-family:"Public Sans",system-ui,sans-serif;font-size:.82rem;color:var(--suave)}
.notas{margin-top:2.5rem;padding:1.25rem 1.5rem;border-left:3px solid var(--vino);background:var(--papel)}
.notas h2{font-size:1.1rem;margin-bottom:.4rem}
.notas p{margin:0;max-width:70ch}
.acciones{margin-top:2rem}
.imprimir{font-size:.9rem;padding:.55rem 1.1rem;border:1px solid var(--tinta);background:var(--tinta);color:#fff;border-radius:2px;cursor:pointer}
.imprimir:hover{background:var(--vino);border-color:var(--vino)}
@media print{.volver,.acciones,.ayuda,input,select{display:none!important}body{background:#fff}.pagina{padding:0}.cabecera{grid-template-columns:1.2fr 1fr}}
</style>
</head>

function cantidad(a, u, factor) {
  let v = a * factor;
  if (u === "ml" && v >= 1000) { v = v / 1000; u = "L"; }
  if (u === "g" && v >= 1000) { v = v / 1000; u = "kg"; }
  const r = Math.round(v * 4) / 4;
  const ent = Math.floor(r);
  const fr = { 0: "", 0.25: "¼", 0.5: "½", 0.75: "¾" }[r - ent];
  const num = v >= 20 ? String(Math.round(v)) : (ent === 0 ? fr || "0" : `${ent}${fr}`);
  return `${num} ${u}`;
}

          <li key={r.id}>
            <button className="entrada" onClick={() => onAbrir(r.id)}>
              <img src={r.imagen} alt={r.pie} />
              <span>
                <h2>{r.nombre}</h2>
                <p>{r.resumen}</p>
                <span className="datos">{r.tiempo} · Dificultad {r.dificultad.toLowerCase()} · {r.porciones} porciones</span>
              </span>
            </button>
          </li>
        ))}
      </ul>
    </div>
  );
}

function Receta({ receta, onVolver }) {
  const [porciones, setPorciones] = useState(receta.porciones);
  const [marcados, setMarcados] = useState({});
  const factor = porciones / receta.porciones;
  useEffect(() => { window.scrollTo(0, 0); }, []);

  return (
    <div className="pagina">
      <button className="volver" onClick={onVolver}>‹ Volver al índice</button>

      <header className="cabecera">
        <div>
          <h1>{receta.nombre}</h1>
          <p className="resumen">{receta.resumen}</p>
          <dl>
            <dt>Porciones</dt>
            <dd>
              <select value={porciones} onChange={(e) => setPorciones(Number(e.target.value))} aria-label="Número de porciones">
                {Array.from({ length: 16 }, (_, i) => i + 1).map((n) => (
                  <option key={n} value={n}>{n}</option>
                ))}
              </select>
            </dd>
            <dt>Tiempo total</dt>
            <dd>{receta.tiempo}</dd>
            <dt>Dificultad</dt>
            <dd>{receta.dificultad}</dd>
          </dl>
        </div>
        <figure>
          <img src={receta.imagen} alt={receta.pie} />
          <figcaption>{receta.pie}</figcaption>
        </figure>
      </header>

      <div className="cuerpo">
        <section aria-labelledby="ing">
          <h2 className="seccion" id="ing">Ingredientes</h2>
          <p className="ayuda">Marque los ingredientes que ya tiene. Las cantidades cambian al modificar las porciones.</p>
          <table>
            <tbody>
              {receta.ingredientes.map((ing, i) => (
                <tr key={ing.n} className={marcados[i] ? "ok" : ""}>
                  <td className="cant">{cantidad(ing.a, ing.u, factor)}</td>
                  <td>
                    <label>
                      <input type="checkbox" checked={!!marcados[i]} onChange={() => setMarcados((m) => ({ ...m, [i]: !m[i] }))} />
                      <span>{ing.n}</span>
                    </label>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </section>

        <section aria-labelledby="pre">
          <h2 className="seccion" id="pre">Preparación</h2>
          <ol>
            {receta.pasos.map((p) => (
              <li key={p.t}>
                <div>
                  <h3>{p.t}</h3>
                  <p>{p.d}</p>
                  <span className="t">{p.min}</span>
                </div>
              </li>
            ))}
          </ol>
        </section>
      </div>

      <aside className="notas">
        <h2>Observaciones</h2>
        <p>{receta.notas}</p>
      </aside>

      <div className="acciones">
        <button className="imprimir" onClick={() => window.print()}>Imprimir receta</button>
      </div>
    </div>
  );
}

function App() {
  const [abierta, setAbierta] = useState(null);
  const receta = RECETAS.find((r) => r.id === abierta);
  return (
    <React.Fragment>
      {receta ? <Receta key={receta.id} receta={receta} onVolver={() => setAbierta(null)} /> : <Indice onAbrir={setAbierta} />}
      <footer className="pie">Recetario de cocina mexicana · Proyecto en React</footer>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
